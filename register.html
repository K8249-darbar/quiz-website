<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create Account | Quiz Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="auth.css" />
    <script src="https://cdn.jsdelivr.net/npm/firebase@10.8.0/firebase-app-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/firebase@10.8.0/firebase-auth-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/firebase@10.8.0/firebase-firestore-compat.js"></script>
    <script src="auth.js?v=20260922-owner-only" defer></script>
    <script src="register.js?v=20260922-owner-only" defer></script>
  </head>
  <body>
    <main class="auth-card">
      <p class="auth-kicker">Quiz Access</p>
      <h1>Create Account</h1>
      <p class="auth-subtext">Create a Firebase account for the quiz portal.</p>
      <form id="register-form" novalidate>
        <label>
          Full name
          <input type="text" id="fullName" name="fullName" autocomplete="name" minlength="2" placeholder="Your full name" required />
        </label>
        <label>
          Username
          <input type="text" id="username" name="username" autocomplete="username" minlength="3" maxlength="24" pattern="[A-Za-z0-9._-]+" placeholder="3–24 letters, numbers, . _ -" required />
        </label>
        <label>
          Email address
          <input type="email" id="email" name="email" autocomplete="email" placeholder="you@example.com" required />
        </label>
        <label>
          Password
          <input type="password" id="password" name="password" autocomplete="new-password" minlength="6" placeholder="At least 6 characters" required />
        </label>
        <label>
          Confirm password
          <input type="password" id="confirmPassword" name="confirmPassword" autocomplete="new-password" minlength="6" placeholder="Re-enter password" required />
        </label>
        <p class="msg" id="register-message" aria-live="polite"></p>
        <button type="submit">Register</button>
        <div class="social-login-separator"><span>or sign up with</span></div>
        <div class="login-action-buttons">
          <button type="button" id="google-register-btn" class="btn-social btn-google">Google Sign Up</button>
        </div>
      </form>
      <div class="auth-footer">Already have an account? <a href="login.html">Login</a></div>
    </main>
  </body>
</html>
