<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | Quiz Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="auth.css" />
    <script src="https://cdn.jsdelivr.net/npm/firebase@10.8.0/firebase-app-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/firebase@10.8.0/firebase-auth-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/firebase@10.8.0/firebase-firestore-compat.js"></script>
    <script src="auth.js" defer></script>
    <script src="login.js" defer></script>
  </head>
  <body class="login-page">
    <div class="scene-orb orb-a"></div>
    <div class="scene-orb orb-b"></div>
    <main class="auth-login-shell">
      <section class="auth-card login-card">
        <div class="auth-brand">
          <span class="brand-mark">Q</span>
          <p class="brand-text">Quiz Portal</p>
        </div>
        <p class="auth-kicker">Secure Access</p>
        <h1>Welcome Back</h1>
        <p class="auth-subtext">Sign in with your Firebase account.</p>

        <form id="login-form" novalidate>
          <label>
            Email address
            <input type="email" id="identifier" name="identifier" autocomplete="email" placeholder="you@example.com" required />
          </label>
          <label>
            Password
            <input type="password" id="password" name="password" autocomplete="current-password" placeholder="Enter your password" required />
          </label>
          <div class="meta-row">
            <label class="checkbox-label">
              <input type="checkbox" id="rememberMe" name="rememberMe" />
              <span>Remember me</span>
            </label>
            <a class="meta-link" href="#" id="forgot-password-link">Forgot password?</a>
          </div>
          <p class="msg error" id="login-message" aria-live="polite"></p>
          <button type="submit">Login</button>
          <div class="social-login-separator"><span>or continue with</span></div>
          <div class="login-action-buttons">
            <button type="button" id="google-login-btn" class="btn-social btn-google">Google</button>
            <button type="button" id="guest-login-btn" class="btn-social btn-guest">👤 Guest Login</button>
          </div>
        </form>

        <div id="reset-modal" class="auth-modal hidden">
          <div class="auth-modal-content">
            <h3>Reset password</h3>
            <p>We will send a secure password-reset link to your email.</p>
            <form id="reset-form">
              <label>
                Email address
                <input type="email" id="reset-email" autocomplete="email" placeholder="you@example.com" required />
              </label>
              <p class="msg" id="reset-message" aria-live="polite"></p>
              <div class="modal-buttons">
                <button type="submit" class="btn-primary">Send reset email</button>
                <button type="button" id="close-reset-modal" class="btn-secondary">Cancel</button>
              </div>
            </form>
          </div>
        </div>

        <div class="auth-footer">New user? <a href="register.html">Create account</a></div>
      </section>
    </main>
  </body>
</html>
