<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>User Profile | Quiz Game</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="bg-orb orb-1"></div>
    <div class="bg-orb orb-2"></div>
    <div class="bg-grid"></div>

    <main class="app-shell">
      <header class="hero">
        <div class="hero-head">
          <div>
            <p class="hero-kicker">Account Settings & Customization</p>
            <h1>👤 User Profile</h1>
            <p class="hero-subtext">Manage your personal information, avatar, and account profile details.</p>
          </div>
          <div class="hero-user-controls">
            <span id="current-user-badge" class="user-chip"></span>
            <button class="btn btn-secondary" onclick="window.location.href='index.html'">
              🏠 Home / Quiz
            </button>
            <button class="btn btn-secondary" onclick="window.location.href='leaderboard.html'">
              🏆 Leaderboard
            </button>
            <button id="logout-btn" class="btn btn-danger">
              🚪 Logout
            </button>
          </div>
        </div>
      </header>

      <section class="panel">
        <div class="profile-container">
          <div class="profile-card-header">
            <div class="avatar-preview-box">
              <img id="profile-avatar-img" src="" alt="User Avatar" class="profile-avatar" />
            </div>
            <div>
              <h2 id="profile-display-name">Loading...</h2>
              <p id="profile-username" class="text-soft">@username</p>
              <span id="profile-email-badge" class="user-chip">user@email.com</span>
            </div>
          </div>

          <form id="profile-form" class="profile-edit-form margin-top-1rem">
            <div class="form-group">
              <label for="profile-fullname-input">Full Name</label>
              <input type="text" id="profile-fullname-input" class="input-field" required />
            </div>

            <div class="form-group">
              <label for="profile-bio-input">Bio / About Me</label>
              <input type="text" id="profile-bio-input" class="input-field" placeholder="Share something about yourself..." />
            </div>

            <div class="form-group">
              <label>Avatar Choice</label>
              <div class="avatar-presets-grid">
                <img class="avatar-option" src="https://ui-avatars.com/api/?name=Alex+Morgan&background=0D5C4E&color=fff&bold=true&size=128" data-url="https://ui-avatars.com/api/?name=Alex+Morgan&background=0D5C4E&color=fff&bold=true&size=128" alt="Preset 1" />
                <img class="avatar-option" src="https://ui-avatars.com/api/?name=Sam+Dev&background=2563EB&color=fff&bold=true&size=128" data-url="https://ui-avatars.com/api/?name=Sam+Dev&background=2563EB&color=fff&bold=true&size=128" alt="Preset 2" />
                <img class="avatar-option" src="https://ui-avatars.com/api/?name=Kunal+Bariya&background=059669&color=fff&bold=true&size=128" data-url="https://ui-avatars.com/api/?name=Kunal+Bariya&background=059669&color=fff&bold=true&size=128" alt="Preset 3" />
                <img class="avatar-option" src="https://ui-avatars.com/api/?name=Tech+Pro&background=D97706&color=fff&bold=true&size=128" data-url="https://ui-avatars.com/api/?name=Tech+Pro&background=D97706&color=fff&bold=true&size=128" alt="Preset 4" />
              </div>
            </div>

            <div class="form-group">
              <label for="avatar-file-upload">Or Upload Custom Avatar Image</label>
              <input type="file" id="avatar-file-upload" accept="image/*" class="input-field" />
            </div>

            <p id="profile-msg" class="msg"></p>

            <button type="submit" class="btn btn-primary w-full">
              💾 Save Profile
            </button>
          </form>
        </div>
      </section>
    </main>

    <script src="auth.js?v=20260922-user-roles"></script>
    <script src="profile.js"></script>
  </body>
</html>
